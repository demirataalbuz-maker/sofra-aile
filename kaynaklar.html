<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sofra · Görsel kaynakları</title><link rel="stylesheet" href="./style.css"></head><body><main class="app"><a href="./" style="display:block;padding:18px 0;color:#a33928">‹ Sofra’ya dön</a><h1>Görsel kaynakları</h1><p>Lisanslı fotoğraflar kaynak dosyalarından alınmıştır; arayüzde ölçeklenerek gösterilir. Diğer kapaklar ve teknik örnekler Sofra için üretilmiş temsili görsellerdir.</p><div id="credits"></div></main><script>fetch('./photo-credits.json').then(r=>r.json()).then(list=>{const root=document.getElementById('credits');for(const item of list){const p=document.createElement('p');p.className='panel';p.append(document.createTextNode(item.title+' — '+item.artist+' · '+item.license+' · '));const a=document.createElement('a');a.href=item.sourceUrl;a.textContent='Kaynak';a.rel='noopener noreferrer';a.target='_blank';p.append(a);root.append(p)}})</script></body></html>
