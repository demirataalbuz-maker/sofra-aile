name: Android tariflerini webde güncelle
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sofra-aile-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - run: python scripts/sync_android_catalog.py
      - name: Publish updated recipes
        run: |
          if git diff --quiet -- catalog.json sync-state.json images; then
            echo 'No newer Android release.'
            exit 0
          fi
          git config user.name 'sofra-update-bot'
          git config user.email 'sofra-update-bot@users.noreply.github.com'
          git add catalog.json sync-state.json images
          git commit -m 'Sync public recipes from Android release'
          git push
